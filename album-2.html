<p>Lançado mundialmente em 8 de setembro de 2023,o significado de GUTS é estômago. Olivia acertou em cheio ao escolher este nome,que a princípio parece estranho para um álbum,mas esquecem que é exatamente no estômago(e no coração) onde e fato podemos sentir as emoções. </p>
